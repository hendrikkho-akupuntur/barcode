<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Barcode - Android Compatible</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .scanner-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 20px;
            max-width: 500px;
            width: 100%;
        }

        .scanner-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .scanner-header h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .scanner-header p {
            color: #666;
            font-size: 14px;
        }

        #reader {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 2px solid #667eea;
        }

        #reader video {
            width: 100% !important;
            height: auto !important;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 100px;
            padding: 12px 15px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .btn-start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-stop {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-switch {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .btn-clear {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .btn-file {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #333;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .result-container {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            border: 2px solid #e9ecef;
            margin-bottom: 15px;
        }

        .result-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .result-text {
            font-size: 16px;
            color: #007bff;
            font-weight: bold;
            word-wrap: break-word;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: underline;
            padding: 5px;
            border-radius: 5px;
        }

        .result-text:hover {
            background-color: #e7f1ff;
            color: #0056b3;
        }

        .result-text.no-link {
            color: #333;
            cursor: default;
            text-decoration: none;
        }

        .result-text.no-link:hover {
            background-color: transparent;
            color: #333;
        }

        .scan-history {
            margin-top: 15px;
        }

        .scan-history h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .history-list {
            max-height: 200px;
            overflow-y: auto;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 10px;
        }

        .history-item {
            padding: 8px 10px;
            margin-bottom: 6px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            font-size: 13px;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-content {
            cursor: pointer;
            color: #007bff;
            text-decoration: underline;
            flex: 1;
            word-break: break-all;
        }

        .history-content:hover {
            color: #0056b3;
        }

        .history-content.no-link {
            color: #333;
            cursor: default;
            text-decoration: none;
        }

        .history-content.no-link:hover {
            color: #333;
        }

        .history-item:last-child {
            margin-bottom: 0;
        }

        .history-time {
            font-size: 11px;
            color: #999;
            margin-left: 10px;
            white-space: nowrap;
        }

        .status-indicator {
            text-align: center;
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
        }

        .status-scanning {
            background: #d4edda;
            color: #155724;
        }

        .status-stopped {
            background: #f8d7da;
            color: #721c24;
        }

        .status-loading {
            background: #fff3cd;
            color: #856404;
        }

        .file-input {
            display: none;
        }

        /* Custom Alert Styling */
        .custom-alert-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .custom-alert-overlay.show {
            display: flex;
        }

        .custom-alert-box {
            background: white;
            border-radius: 15px;
            padding: 25px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        .custom-alert-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .custom-alert-message {
            font-size: 16px;
            color: #333;
            margin-bottom: 20px;
            word-break: break-all;
        }

        .custom-alert-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .custom-alert-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .link-info {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }

        @media (max-width: 480px) {
            .scanner-container {
                padding: 15px;
            }
            
            .button-group button {
                font-size: 12px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="scanner-container">
        <div class="scanner-header">
            <h1>📱 Scanner Barcode</h1>
            <p>Scan QR Code & Barcode dengan Mudah</p>
        </div>

        <div id="status-indicator" class="status-indicator status-loading">
            ⏳ Memuat scanner...
        </div>

        <div id="reader"></div>

        <div class="button-group">
            <button class="btn-start" onclick="startScanner()" id="btn-start">
                ▶ Mulai
            </button>
            <button class="btn-stop" onclick="stopScanner()" id="btn-stop" disabled>
                ⏹ Stop
            </button>
            <button class="btn-switch" onclick="switchCamera()" id="btn-switch" disabled>
                🔄 Ganti Kamera
            </button>
        </div>

        <div class="button-group">
            <button class="btn-clear" onclick="clearHistory()">
                🗑 Clear History
            </button>
            <button class="btn-file" onclick="document.getElementById('file-input').click()">
                📁 Scan dari Gambar
            </button>
            <input type="file" id="file-input" class="file-input" accept="image/*" onchange="scanFromFile(event)">
        </div>

        <div class="result-container">
            <div class="result-label">📋 Hasil Scan Terakhir:</div>
            <div class="result-text" id="scan-result" onclick="handleResultClick(this)">
                Menunggu scan...
            </div>
        </div>

        <div class="scan-history">
            <h3>📝 Riwayat Scan</h3>
            <div class="history-list" id="history-list">
                <div style="color: #999; text-align: center; padding: 20px;">
                    Belum ada hasil scan
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Alert Popup -->
    <div class="custom-alert-overlay" id="custom-alert">
        <div class="custom-alert-box">
            <div class="custom-alert-icon">✅</div>
            <div class="custom-alert-message" id="alert-message"></div>
            <div class="link-info" id="link-info"></div>
            <button class="custom-alert-button" onclick="closeCustomAlert()">OK</button>
        </div>
    </div>

    <!-- Menggunakan library html5-qrcode yang lebih stabil -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <script>
        let html5QrCode = null;
        let currentCameraId = null;
        let isScanning = false;
        let scanHistory = JSON.parse(localStorage.getItem('scanHistory') || '[]');
        let cameras = [];
        let lastScannedResult = '';

        // Custom Alert Functions
        function showCustomAlert(message, isLink = false) {
            document.getElementById('alert-message').textContent = message;
            const linkInfo = document.getElementById('link-info');
            
            if (isLink) {
                linkInfo.textContent = '💡 Klik hasil scan untuk membuka link';
                linkInfo.style.display = 'block';
            } else {
                linkInfo.textContent = '';
                linkInfo.style.display = 'none';
            }
            
            document.getElementById('custom-alert').classList.add('show');
        }

        function closeCustomAlert() {
            document.getElementById('custom-alert').classList.remove('show');
        }

        // Fungsi untuk mengecek apakah string adalah URL
        function isValidUrl(string) {
            try {
                const url = new URL(string);
                return url.protocol === 'http:' || url.protocol === 'https:';
            } catch (_) {
                return false;
            }
        }

        // Fungsi untuk membuka link dari hasil scan
        function handleResultClick(element) {
            const text = element.textContent;
            
            if (text && text !== 'Menunggu scan...' && isValidUrl(text)) {
                window.open(text, '_blank');
            }
        }

        // Fungsi untuk membuka link dari history
        function openLinkFromHistory(content) {
            if (isValidUrl(content)) {
                window.open(content, '_blank');
            }
        }

        // Inisialisasi scanner
        function initScanner() {
            try {
                html5QrCode = new Html5Qrcode("reader");
                updateStatus('loading', '⏳ Memeriksa kamera...');
                getCameras();
            } catch (error) {
                console.error('Error inisialisasi:', error);
                updateStatus('stopped', '❌ Gagal inisialisasi scanner');
            }
        }

        // Mendapatkan daftar kamera
        function getCameras() {
            Html5Qrcode.getCameras()
                .then(devices => {
                    cameras = devices;
                    if (devices && devices.length > 0) {
                        console.log('Kamera tersedia:', devices);
                        updateStatus('stopped', `✅ ${devices.length} kamera ditemukan. Klik "Mulai" untuk scan`);
                        
                        // Cari kamera belakang secara otomatis
                        let backCamera = devices.find(camera => 
                            camera.label && camera.label.toLowerCase().includes('back')
                        );
                        
                        // Jika tidak ada kamera belakang, gunakan kamera pertama
                        if (!backCamera && devices.length > 0) {
                            backCamera = devices[0];
                        }
                        
                        if (backCamera) {
                            currentCameraId = backCamera.id;
                            console.log('Kamera dipilih:', backCamera.label);
                        }
                        
                        enableButtons(true);
                    } else {
                        updateStatus('stopped', '❌ Tidak ada kamera ditemukan');
                        enableButtons(false);
                    }
                })
                .catch(err => {
                    console.error('Error mendapatkan kamera:', err);
                    updateStatus('stopped', '❌ Gagal mengakses kamera. Izinkan akses kamera dan refresh halaman');
                    enableButtons(false);
                });
        }

        // Memulai scanner
        function startScanner() {
            if (!html5QrCode || isScanning) return;

            if (!currentCameraId && cameras.length > 0) {
                currentCameraId = cameras[0].id;
            }

            if (!currentCameraId) {
                alert('Tidak ada kamera tersedia');
                return;
            }

            const config = {
                fps: 10,
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0,
                showTorchButtonIfSupported: true,
                showZoomSliderIfSupported: true,
            };

            updateStatus('loading', '⏳ Memulai kamera...');
            
            html5QrCode.start(
                currentCameraId,
                config,
                onScanSuccess,
                onScanError
            )
            .then(() => {
                isScanning = true;
                updateStatus('scanning', '🔍 Scanner aktif - Arahkan ke barcode');
                updateButtons();
                console.log('Scanner berhasil dimulai');
            })
            .catch(err => {
                console.error('Error memulai scanner:', err);
                isScanning = false;
                updateStatus('stopped', '❌ Gagal memulai scanner: ' + err.message);
                updateButtons();
                alert('Gagal memulai scanner. Error: ' + err.message + '\n\nCoba:\n1. Refresh halaman\n2. Izinkan akses kamera\n3. Gunakan browser Chrome');
            });
        }

        // Callback saat scan berhasil
        function onScanSuccess(decodedText, decodedResult) {
            console.log('Scan berhasil:', decodedText);
            
            lastScannedResult = decodedText;
            
            // Update tampilan hasil
            const resultElement = document.getElementById('scan-result');
            resultElement.textContent = decodedText;
            
            // Cek apakah hasil scan adalah URL
            const isLink = isValidUrl(decodedText);
            
            if (isLink) {
                resultElement.className = 'result-text';
                resultElement.title = 'Klik untuk membuka link';
                resultElement.style.cursor = 'pointer';
            } else {
                resultElement.className = 'result-text no-link';
                resultElement.title = '';
                resultElement.style.cursor = 'default';
            }
            
            // Animasi feedback
            resultElement.style.color = '#007bff';
            resultElement.style.transform = 'scale(1.05)';
            setTimeout(() => {
                if (!isLink) {
                    resultElement.style.color = '#333';
                }
                resultElement.style.transform = 'scale(1)';
            }, 300);

            // Simpan ke riwayat
            const scanEntry = {
                content: decodedText,
                isLink: isLink,
                timestamp: new Date().toLocaleString('id-ID', {
                    day: 'numeric',
                    month: 'short',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                })
            };
            
            scanHistory.unshift(scanEntry);
            if (scanHistory.length > 50) {
                scanHistory = scanHistory.slice(0, 50);
            }
            
            localStorage.setItem('scanHistory', JSON.stringify(scanHistory));
            updateHistoryDisplay();

            // Tampilkan popup custom
            showCustomAlert('Scan Berhasil!\n\n' + decodedText, isLink);
            
            // Hentikan scanner setelah scan berhasil
            stopScanner();
        }

        // Callback saat scan error (biasanya frame tanpa barcode)
        function onScanError(errorMessage) {
            // Tidak perlu menampilkan error setiap frame
            // console.log('Scan error:', errorMessage);
        }

        // Menghentikan scanner
        function stopScanner() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop()
                    .then(() => {
                        isScanning = false;
                        updateStatus('stopped', '⏸ Scanner dihentikan. Siap scan lagi');
                        updateButtons();
                        console.log('Scanner dihentikan');
                    })
                    .catch(err => {
                        console.error('Error menghentikan scanner:', err);
                    });
            }
        }

        // Mengganti kamera (depan/belakang)
        function switchCamera() {
            if (!html5QrCode || cameras.length < 2) {
                alert('Hanya tersedia 1 kamera');
                return;
            }

            stopScanner();
            
            // Cari index kamera saat ini
            let currentIndex = cameras.findIndex(camera => camera.id === currentCameraId);
            
            // Pindah ke kamera berikutnya
            currentIndex = (currentIndex + 1) % cameras.length;
            currentCameraId = cameras[currentIndex].id;
            
            console.log('Beralih ke kamera:', cameras[currentIndex].label);
            
            // Mulai scanner dengan kamera baru
            setTimeout(() => {
                startScanner();
            }, 500);
        }

        // Scan barcode dari file gambar
        function scanFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            stopScanner();
            updateStatus('loading', '⏳ Memproses gambar...');

            html5QrCode.scanFile(file, true)
                .then(decodedText => {
                    onScanSuccess(decodedText, null);
                    updateStatus('stopped', '✅ Scan dari gambar berhasil');
                })
                .catch(err => {
                    console.error('Error scan file:', err);
                    alert('Gagal membaca barcode dari gambar. Pastikan gambar berisi barcode yang jelas.');
                    updateStatus('stopped', '❌ Gagal membaca barcode dari gambar');
                });
            
            // Reset input file
            event.target.value = '';
        }

        // Update status indicator
        function updateStatus(type, message) {
            const indicator = document.getElementById('status-indicator');
            indicator.textContent = message;
            indicator.className = 'status-indicator';
            
            switch(type) {
                case 'scanning':
                    indicator.classList.add('status-scanning');
                    break;
                case 'stopped':
                    indicator.classList.add('status-stopped');
                    break;
                case 'loading':
                    indicator.classList.add('status-loading');
                    break;
            }
        }

        // Enable/disable buttons
        function enableButtons(enable) {
            document.getElementById('btn-start').disabled = !enable;
            document.getElementById('btn-switch').disabled = !enable || cameras.length < 2;
        }

        // Update button states
        function updateButtons() {
            document.getElementById('btn-start').disabled = isScanning;
            document.getElementById('btn-stop').disabled = !isScanning;
            document.getElementById('btn-switch').disabled = isScanning || cameras.length < 2;
        }

        // Update tampilan riwayat
        function updateHistoryDisplay() {
            const historyList = document.getElementById('history-list');
            
            if (scanHistory.length === 0) {
                historyList.innerHTML = '<div style="color: #999; text-align: center; padding: 20px;">Belum ada hasil scan</div>';
                return;
            }

            historyList.innerHTML = scanHistory.map(entry => `
                <div class="history-item">
                    <span class="history-content ${entry.isLink ? '' : 'no-link'}" 
                          onclick="${entry.isLink ? `openLinkFromHistory('${entry.content.replace(/'/g, "\\'")}')` : ''}"
                          title="${entry.isLink ? 'Klik untuk membuka link' : ''}">
                        ${entry.content}
                    </span>
                    <span class="history-time">${entry.timestamp}</span>
                </div>
            `).join('');
        }

        // Menghapus riwayat
        function clearHistory() {
            if (confirm('Apakah Anda yakin ingin menghapus semua riwayat scan?')) {
                scanHistory = [];
                localStorage.removeItem('scanHistory');
                updateHistoryDisplay();
            }
        }

        // Inisialisasi saat halaman dimuat
        window.addEventListener('load', function() {
            initScanner();
            updateHistoryDisplay();
        });

        // Cleanup saat halaman ditutup
        window.addEventListener('beforeunload', function() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().catch(err => console.error(err));
            }
        });

        // Handle visibility change (saat user pindah tab)
        document.addEventListener('visibilitychange', function() {
            if (document.hidden && isScanning) {
                stopScanner();
            }
        });
    </script>
</body>
</html>
